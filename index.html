<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主机安全纳管检查</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #080c16;
    --bg-card: #0f1524;
    --bg-card-hover: #141c30;
    --bg-elevated: #1a2340;
    --border-subtle: rgba(0, 240, 255, 0.08);
    --border-card: rgba(0, 240, 255, 0.12);
    --border-active: rgba(0, 240, 255, 0.35);
    --cyan: #00f0ff;
    --cyan-dim: rgba(0, 240, 255, 0.15);
    --cyan-glow: rgba(0, 240, 255, 0.08);
    --emerald: #34d399;
    --emerald-dim: rgba(52, 211, 153, 0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245, 158, 11, 0.12);
    --rose: #f43f5e;
    --rose-dim: rgba(244, 63, 94, 0.12);
    --text-primary: #e8edf5;
    --text-secondary: #8892a8;
    --text-muted: #4a5570;
    --font-display: 'Outfit', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-display);
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(52, 211, 153, 0.02) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(245, 158, 11, 0.015) 0%, transparent 50%);
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  .container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 32px 24px 48px;
    position: relative;
    z-index: 1;
  }

  /* --- HEADER --- */
  .header {
    margin-bottom: 36px;
    animation: fadeSlideDown 0.6s ease-out both;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-title-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--cyan-dim);
    border: 1px solid var(--border-active);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    box-shadow: 0 0 20px var(--cyan-glow);
  }
  .header h1 {
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #e8edf5 0%, #8892a8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 400;
    margin-top: 4px;
    letter-spacing: 0.01em;
  }
  .header-badge {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--cyan);
    background: var(--cyan-dim);
    border: 1px solid var(--border-active);
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* --- CARDS --- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    backdrop-filter: blur(8px);
    transition: border-color 0.3s, box-shadow 0.3s;
    animation: fadeSlideUp 0.5s ease-out both;
  }
  .card:nth-child(2) { animation-delay: 0.08s; }
  .card:nth-child(3) { animation-delay: 0.16s; }
  .card:nth-child(4) { animation-delay: 0.24s; }
  .card:hover {
    border-color: var(--border-active);
    box-shadow: 0 0 30px var(--cyan-glow);
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .card-title .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--cyan-dim);
    color: var(--cyan);
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: var(--font-mono);
    border: 1px solid var(--border-active);
  }

  /* --- UPLOAD AREA --- */
  .upload-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .upload-box {
    border: 1.5px dashed var(--border-subtle);
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    background: rgba(255,255,255,0.015);
  }
  .upload-box:hover {
    border-color: var(--cyan);
    background: var(--cyan-dim);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,240,255,0.06);
  }
  .upload-box.loaded {
    border-color: var(--emerald);
    border-style: solid;
    background: var(--emerald-dim);
  }
  .upload-box.loaded:hover {
    box-shadow: 0 8px 32px rgba(52,211,153,0.08);
  }
  .upload-box input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .upload-icon {
    font-size: 2rem;
    margin-bottom: 10px;
    display: block;
    line-height: 1;
  }
  .upload-label {
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 0.95rem;
  }
  .upload-hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }
  .upload-status {
    font-size: 0.82rem;
    margin-top: 10px;
    font-weight: 500;
    font-family: var(--font-mono);
    min-height: 1.2em;
  }

  /* --- CONFIG --- */
  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .config-group label {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 5px;
    letter-spacing: 0.02em;
  }
  .config-group input {
    width: 100%;
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: var(--font-mono);
    color: var(--text-primary);
    transition: border-color 0.25s, box-shadow 0.25s;
    outline: none;
  }
  .config-group input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px var(--cyan-glow);
  }
  .config-group input::placeholder {
    color: var(--text-muted);
  }

  /* --- BUTTONS --- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 28px;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: var(--font-display);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.01em;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
    pointer-events: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00c8d6, #00f0ff);
    color: #080c16;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,240,255,0.25);
  }
  .btn-primary:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }
  .btn-primary:disabled::after { display: none; }
  .btn-success {
    background: linear-gradient(135deg, #059669, #34d399);
    color: #080c16;
  }
  .btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(52,211,153,0.25);
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-card);
    color: var(--text-secondary);
  }
  .btn-outline:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
  }
  .btn-sm {
    padding: 8px 18px;
    font-size: 0.82rem;
    border-radius: 8px;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  /* --- LOG AREA --- */
  .log-area {
    background: #040810;
    border-radius: 10px;
    padding: 18px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    max-height: 220px;
    overflow-y: auto;
    line-height: 1.7;
    border: 1px solid var(--border-subtle);
    margin-top: 20px;
  }
  .log-area::-webkit-scrollbar { width: 4px; }
  .log-area::-webkit-scrollbar-track { background: transparent; }
  .log-area::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }
  .log-area .step { color: var(--cyan); }
  .log-area .ok { color: var(--emerald); }
  .log-area .err { color: var(--rose); }
  .log-area .warn { color: var(--amber); }

  /* --- TABS --- */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 20px;
  }
  .tab {
    padding: 12px 24px;
    cursor: pointer;
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.25s;
    position: relative;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab.active {
    color: var(--cyan);
    border-bottom-color: var(--cyan);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* --- STATS --- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
    transition: border-color 0.25s;
  }
  .stat-card:hover {
    border-color: var(--border-active);
  }
  .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    font-family: var(--font-mono);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 3px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* --- SHEET TABS --- */
  .sheet-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 14px;
    overflow-x: auto;
  }
  .sheet-tabs::-webkit-scrollbar { height: 2px; }
  .sheet-tabs::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 1px; }
  .sheet-tab {
    padding: 7px 16px;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    font-family: var(--font-mono);
    transition: all 0.2s;
  }
  .sheet-tab:hover { color: var(--text-secondary); }
  .sheet-tab.active {
    color: var(--cyan);
    border-bottom-color: var(--cyan);
    font-weight: 500;
  }

  /* --- TABLE --- */
  .table-wrap {
    max-height: 420px;
    overflow: auto;
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
  }
  .table-wrap::-webkit-scrollbar { width: 4px; height: 4px; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-family: var(--font-mono); }
  th {
    background: rgba(0,240,255,0.04);
    padding: 10px 14px;
    text-align: left;
    font-weight: 500;
    font-family: var(--font-display);
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); color: var(--text-primary); }
  tr:hover td { background: rgba(0,240,255,0.02); }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }
  .badge-danger {
    background: var(--rose-dim);
    color: var(--rose);
    border: 1px solid rgba(244,63,94,0.15);
  }
  .badge-warning {
    background: var(--amber-dim);
    color: var(--amber);
    border: 1px solid rgba(245,158,11,0.15);
  }

  .empty-msg {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .hidden { display: none !important; }

  /* --- ANIMATIONS --- */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 10px var(--cyan-glow); }
    50% { box-shadow: 0 0 25px rgba(0,240,255,0.12); }
  }
  .header-icon {
    animation: pulse-glow 3s ease-in-out infinite;
  }

  /* --- RESPONSIVE --- */
  @media (max-width: 768px) {
    .container { padding: 20px 16px 32px; }
    .header h1 { font-size: 1.3rem; }
    .header-icon { width: 36px; height: 36px; font-size: 1rem; }
    .card { padding: 20px; border-radius: 12px; }
    .upload-area { grid-template-columns: 1fr; }
    .config-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .tabs { overflow-x: auto; }
    .tab { padding: 10px 16px; font-size: 0.82rem; white-space: nowrap; }
  }

  @media (max-width: 480px) {
    .header-top { flex-direction: column; align-items: flex-start; }
    .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-value { font-size: 1.3rem; }
    .actions { flex-direction: column; }
    .actions .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="header-top">
      <div class="header-title-group">
        <div class="header-icon">&#9762;</div>
        <div>
          <h1>主机安全纳管检查</h1>
          <p class="subtitle">上传基地资产表和平台数据，自动检测未安装/离线Agent及账外资产</p>
        </div>
      </div>
      <span class="header-badge">Compliance Scanner v1.0</span>
    </div>
  </header>

  <div class="card">
    <div class="card-title"><span class="step-num">1</span> 上传数据文件</div>
    <div class="upload-area">
      <div class="upload-box" id="boxBase">
        <input type="file" accept=".xlsx,.xls" id="fileBase" onchange="handleFile('base', this)">
        <span class="upload-icon">&#128196;</span>
        <div class="upload-label">基地资产表</div>
        <div class="upload-hint">base.xlsx (.xlsx)</div>
        <div class="upload-status" id="statusBase"></div>
      </div>
      <div class="upload-box" id="boxPlat">
        <input type="file" accept=".csv" id="filePlat" onchange="handleFile('plat', this)">
        <span class="upload-icon">&#128202;</span>
        <div class="upload-label">安全平台数据</div>
        <div class="upload-hint">plat.csv (.csv)</div>
        <div class="upload-status" id="statusPlat"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="step-num">2</span> 列名配置</div>
    <div class="config-grid">
      <div class="config-group">
        <label>基地表 - IP列名</label>
        <input type="text" id="cfgBaseIp" value="IP地址">
      </div>
      <div class="config-group">
        <label>基地表 - 是否应部署列名</label>
        <input type="text" id="cfgDeployFlag" value="是否应部署">
      </div>
      <div class="config-group">
        <label>平台表 - IP列名</label>
        <input type="text" id="cfgPlatIp" value="主机 IP">
      </div>
      <div class="config-group">
        <label>平台表 - 状态列名</label>
        <input type="text" id="cfgPlatStatus" value="主机状态">
      </div>
      <div class="config-group">
        <label>账外资产分组列名</label>
        <input type="text" id="cfgGroupCol" value="所属部门">
      </div>
      <div class="config-group">
        <label>CSV编码</label>
        <input type="text" id="cfgCsvEnc" value="utf-8">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="step-num">3</span> 执行检测</div>
    <div class="actions">
      <button class="btn btn-primary" id="btnRun" onclick="runCheck()" disabled>运行检测</button>
      <button class="btn btn-outline hidden" id="btnReset" onclick="resetAll()">重新上传</button>
    </div>
    <div class="log-area hidden" id="logArea"></div>
  </div>

  <div class="card hidden" id="resultArea">
    <div class="tabs">
      <div class="tab active" data-tab="abnormal" onclick="switchTab('abnormal')">异常资产</div>
      <div class="tab" data-tab="unknown" onclick="switchTab('unknown')">账外资产</div>
    </div>

    <div class="tab-content active" id="tab-abnormal">
      <div class="stats" id="statsAbnormal"></div>
      <div class="actions" style="margin-bottom:12px">
        <button class="btn btn-success btn-sm" onclick="exportAbnormal()">导出异常报告</button>
      </div>
      <div class="sheet-tabs" id="abnormalSheetTabs"></div>
      <div class="table-wrap" id="abnormalTableWrap"></div>
    </div>

    <div class="tab-content" id="tab-unknown">
      <div class="stats" id="statsUnknown"></div>
      <div class="actions" style="margin-bottom:12px">
        <button class="btn btn-success btn-sm" onclick="exportUnknown()">导出账外资产</button>
      </div>
      <div class="sheet-tabs" id="unknownSheetTabs"></div>
      <div class="table-wrap" id="unknownTableWrap"></div>
    </div>
  </div>
</div>

<script>
let baseData = null;
let platData = null;
let abnormalResult = {};
let unknownResult = {};

function log(msg, type = '') {
  const el = document.getElementById('logArea');
  el.classList.remove('hidden');
  const span = document.createElement('div');
  if (type) span.className = type;
  span.textContent = msg;
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}

function handleFile(type, input) {
  const file = input.files[0];
  if (!file) return;

  if (type === 'base') {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        baseData = {};
        wb.SheetNames.forEach(name => {
          baseData[name] = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' });
        });
        const sheetCount = Object.keys(baseData).length;
        let totalRows = 0;
        Object.values(baseData).forEach(d => totalRows += d.length);
        document.getElementById('statusBase').textContent = `已加载: ${sheetCount}个Sheet, ${totalRows}行`;
        document.getElementById('statusBase').style.color = 'var(--emerald)';
        document.getElementById('boxBase').classList.add('loaded');
        checkReady();
      } catch(err) {
        document.getElementById('statusBase').textContent = '读取失败: ' + err.message;
        document.getElementById('statusBase').style.color = 'var(--rose)';
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const encoding = document.getElementById('cfgCsvEnc').value || 'utf-8';
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        let text = e.target.result;
        if (encoding.toLowerCase() === 'gbk' || encoding.toLowerCase() === 'gb2312') {
          const decoder = new TextDecoder('gbk');
          const arrayBuf = new Uint8Array(reader.result);
          text = decoder.decode(arrayBuf);
        }
        const wb = XLSX.read(text, { type: 'string' });
        platData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
        document.getElementById('statusPlat').textContent = `已加载: ${platData.length}行`;
        document.getElementById('statusPlat').style.color = 'var(--emerald)';
        document.getElementById('boxPlat').classList.add('loaded');
        checkReady();
      } catch(err) {
        document.getElementById('statusPlat').textContent = '读取失败: ' + err.message;
        document.getElementById('statusPlat').style.color = 'var(--rose)';
      }
    };
    if (encoding.toLowerCase() === 'gbk' || encoding.toLowerCase() === 'gb2312') {
      reader.readAsArrayBuffer(file);
    } else {
      reader.readAsText(file, encoding);
    }
  }
}

function checkReady() {
  document.getElementById('btnRun').disabled = !(baseData && platData);
}

function strip(v) { return String(v).trim(); }

function runCheck() {
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('logArea').classList.remove('hidden');
  document.getElementById('btnRun').disabled = true;
  abnormalResult = {};
  unknownResult = {};

  const colBaseIp = document.getElementById('cfgBaseIp').value.trim();
  const colDeployFlag = document.getElementById('cfgDeployFlag').value.trim();
  const colPlatIp = document.getElementById('cfgPlatIp').value.trim();
  const colPlatStatus = document.getElementById('cfgPlatStatus').value.trim();
  const cfgGroupCol = document.getElementById('cfgGroupCol').value.trim();

  log('1. 正在处理安全平台数据...');
  const platMap = {};
  platData.forEach(row => {
    const ip = strip(row[colPlatIp]);
    const status = strip(row[colPlatStatus]).toLowerCase();
    if (ip) platMap[ip] = status;
  });
  log(`   -> 平台记录数: ${platData.length}, 唯一IP数: ${Object.keys(platMap).length}`, 'ok');

  log('2. 正在处理基地资产表...');
  const allKnownIps = new Set();

  log('3. 开始对比并生成异常报告...');
  for (const [sheetName, rows] of Object.entries(baseData)) {
    if (!rows.length) continue;
    if (!rows[0].hasOwnProperty(colBaseIp)) {
      log(`   -> Sheet [${sheetName}] 未找到列 [${colBaseIp}]，跳过`, 'warn');
      continue;
    }

    const ipsInSheet = rows.map(r => strip(r[colBaseIp]));
    ipsInSheet.forEach(ip => { if (ip) allKnownIps.add(ip); });

    const filtered = rows.filter(r => strip(r[colDeployFlag]) === '是');
    if (!filtered.length) {
      log(`   -> Sheet [${sheetName}] 无"应部署"资产，跳过`, 'warn');
      continue;
    }

    const abnormalRows = [];
    for (const row of filtered) {
      const ip = strip(row[colBaseIp]);
      if (!ip) continue;
      const platStatus = platMap[ip];

      let abnormalType = null;
      if (platStatus === undefined) {
        abnormalType = '未安装Agent';
      } else if (platStatus === 'offline') {
        abnormalType = 'Agent离线';
      }

      if (abnormalType) {
        abnormalRows.push({ '异常类型': abnormalType, ...row });
      }
    }

    if (abnormalRows.length) {
      abnormalResult[sheetName] = abnormalRows;
      log(`   -> Sheet [${sheetName}]: 发现 ${abnormalRows.length} 条异常`, 'err');
    } else {
      log(`   -> Sheet [${sheetName}]: 全部正常`, 'ok');
    }
  }

  log('4. 正在分析账外新增资产 (平台有但基地表无)...');
  const unknownRows = platData.filter(row => {
    const ip = strip(row[colPlatIp]);
    const status = strip(row[colPlatStatus]).toLowerCase();
    return status === 'online' && !allKnownIps.has(ip);
  });

  if (unknownRows.length) {
    if (cfgGroupCol && unknownRows[0].hasOwnProperty(cfgGroupCol)) {
      const groups = {};
      unknownRows.forEach(row => {
        const gName = String(row[cfgGroupCol] || '未分组');
        if (!groups[gName]) groups[gName] = [];
        groups[gName].push(row);
      });
      unknownResult = groups;
      log(`   -> 账外资产 ${unknownRows.length} 条，按【${cfgGroupCol}】分为 ${Object.keys(groups).length} 组`, 'warn');
    } else {
      unknownResult = { '账外资产清单': unknownRows };
      log(`   -> 账外资产 ${unknownRows.length} 条`, 'warn');
    }
  } else {
    log('   -> 未发现账外新增资产', 'ok');
  }

  log('检测完成！', 'ok');
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnReset').classList.remove('hidden');
  renderResults();
}

function renderResults() {
  document.getElementById('resultArea').classList.remove('hidden');

  let totalAbnormal = 0, uninstalled = 0, offline = 0, sheetCount = Object.keys(abnormalResult).length;
  Object.values(abnormalResult).forEach(rows => {
    totalAbnormal += rows.length;
    rows.forEach(r => {
      if (r['异常类型'] === '未安装Agent') uninstalled++;
      else if (r['异常类型'] === 'Agent离线') offline++;
    });
  });
  document.getElementById('statsAbnormal').innerHTML = `
    <div class="stat-card"><div class="stat-value" style="color:var(--rose)">${totalAbnormal}</div><div class="stat-label">异常总数</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--rose)">${uninstalled}</div><div class="stat-label">未安装Agent</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--amber)">${offline}</div><div class="stat-label">Agent离线</div></div>
    <div class="stat-card"><div class="stat-value">${sheetCount}</div><div class="stat-label">涉及Sheet</div></div>
  `;

  let totalUnknown = 0;
  Object.values(unknownResult).forEach(rows => totalUnknown += rows.length);
  const groupCount = Object.keys(unknownResult).length;
  document.getElementById('statsUnknown').innerHTML = `
    <div class="stat-card"><div class="stat-value" style="color:var(--amber)">${totalUnknown}</div><div class="stat-label">账外资产总数</div></div>
    <div class="stat-card"><div class="stat-value">${groupCount}</div><div class="stat-label">分组数</div></div>
  `;

  renderSheetTabs('abnormal');
  renderSheetTabs('unknown');
}

function renderSheetTabs(type) {
  const data = type === 'abnormal' ? abnormalResult : unknownResult;
  const tabsEl = document.getElementById(type + 'SheetTabs');
  const wrapEl = document.getElementById(type + 'TableWrap');
  tabsEl.innerHTML = '';
  wrapEl.innerHTML = '';

  const keys = Object.keys(data);
  if (!keys.length) {
    wrapEl.innerHTML = '<div class="empty-msg">未发现异常</div>';
    return;
  }

  keys.forEach((name, i) => {
    const tab = document.createElement('div');
    tab.className = 'sheet-tab' + (i === 0 ? ' active' : '');
    tab.textContent = name;
    tab.onclick = () => {
      tabsEl.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderTable(type, name);
    };
    tabsEl.appendChild(tab);
  });

  renderTable(type, keys[0]);
}

function renderTable(type, sheetName) {
  const data = type === 'abnormal' ? abnormalResult : unknownResult;
  const wrapEl = document.getElementById(type + 'TableWrap');
  const rows = data[sheetName] || [];

  if (!rows.length) {
    wrapEl.innerHTML = '<div class="empty-msg">无数据</div>';
    return;
  }

  const cols = Object.keys(rows[0]);
  let html = '<table><thead><tr>';
  cols.forEach(c => html += `<th>${escHtml(c)}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    cols.forEach(c => {
      let val = row[c] != null ? String(row[c]) : '';
      if (c === '异常类型') {
        const cls = val === '未安装Agent' ? 'badge-danger' : 'badge-warning';
        val = `<span class="badge ${cls}">${escHtml(val)}</span>`;
      } else {
        val = escHtml(val);
      }
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrapEl.innerHTML = html;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));
}

function exportAbnormal() {
  if (!Object.keys(abnormalResult).length) { alert('无异常数据'); return; }
  const wb = XLSX.utils.book_new();
  for (const [name, rows] of Object.entries(abnormalResult)) {
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.substring(0, 31));
  }
  XLSX.writeFile(wb, 'work1_异常资产报告.xlsx');
}

function exportUnknown() {
  if (!Object.keys(unknownResult).length) { alert('无账外资产数据'); return; }
  const wb = XLSX.utils.book_new();
  for (const [name, rows] of Object.entries(unknownResult)) {
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.substring(0, 31));
  }
  XLSX.writeFile(wb, 'work2_账外资产.xlsx');
}

function resetAll() {
  baseData = null;
  platData = null;
  abnormalResult = {};
  unknownResult = {};
  document.getElementById('fileBase').value = '';
  document.getElementById('filePlat').value = '';
  document.getElementById('statusBase').textContent = '';
  document.getElementById('statusPlat').textContent = '';
  document.getElementById('boxBase').classList.remove('loaded');
  document.getElementById('boxPlat').classList.remove('loaded');
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnReset').classList.add('hidden');
  document.getElementById('logArea').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  checkReady();
}
</script>
